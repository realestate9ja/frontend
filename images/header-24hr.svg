        font-size="22" font-weight="bold" fill="#1A1814" letter-spacing="0.5">Veri</text>
  <text x="108" y="46" font-family="Georgia, 'Times New Roman', serif"
        font-size="22" font-weight="bold" font-style="italic" fill="#C4714A" letter-spacing="0.5">nest</text>

  <!-- Badge pill -->
  <rect x="444" y="29" width="92" height="22"
        rx="11" fill="#FFF8F0"/>
  <text x="490" y="44"
        font-family="'DM Sans', Arial, sans-serif"
        font-size="10" font-weight="500" fill="#C07020"
