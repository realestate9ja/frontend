<svg xmlns="http://www.w3.org/2000/svg" width="560" height="80" viewBox="0 0 560 80">
  <rect width="560" height="80" fill="#FAF7F3"/>
  <line x1="0" y1="79" x2="560" y2="79" stroke="#EDE8E0" stroke-width="1"/>

  <!-- Icon box -->
  <rect x="24" y="23" width="34" height="34" rx="9" fill="#C4714A"/>

  <!-- House icon (white) -->
  <!-- Roof -->
  <polyline points="28,43 41,30 54,43" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Door pill -->
  <rect x="38" y="44" width="7" height="10" rx="3.5" fill="white"/>

  <!-- Wordmark: Veri (regular) + nest (italic) -->
